# Popular data targets, for the nightly coverage matrix (COVERAGE.md).
#
# Each entry is probed once per night from a GitHub runner and the verdict is
# published. Nothing here is a promise: a row says what one request got on a
# datacenter IP on that date, and nothing more.
#
# Why this file exists: people ask "does it do Facebook / Reddit / Amazon"
# before they ask anything else. The honest answer is a dated matrix that says
# blocked where it is blocked, instead of a README claim that melts on contact.
#
# Adding a target: one request is the whole cost. Keep group names lowercase,
# keep `name` unique (it keys the matrix), and put the listing URL (not the
# homepage) when the site has one.

targets:
