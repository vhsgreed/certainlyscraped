  - { group: marketplaces, name: amazon-bestsellers, url: "https://www.amazon.com/gp/bestsellers/" }
  - { group: marketplaces, name: ebay-search, url: "https://www.ebay.com/sch/i.html?_nkw=rtx+4090" }
  - { group: marketplaces, name: etsy-search, url: "https://www.etsy.com/search?q=ceramic+mug" }
  - { group: marketplaces, name: aliexpress-search, url: "https://www.aliexpress.com/w/wholesale-led-strip.html" }
  - { group: marketplaces, name: temu-search, url: "https://www.temu.com/search_result.html?search_key=usb+cable" }
