name: release

# Push a tag like v0.4.0 to test, build and check the package; the wheel
# and sdist are kept as workflow artifacts.
#
# Publishing to PyPI is off until you opt in. To publish:
#   1. check that the name `certainlyscraped` is available on PyPI (the
#      command and imports do not change if it is not);
#   2. on pypi.org: Account -> Publishing -> add a pending trusted publisher
#      for this repository, workflow `release.yml`, environment `pypi`;
#   3. in GitHub: Settings -> Secrets and variables -> Actions -> Variables,
#      add PYPI_PUBLISH = true.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: tag matches package version
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('certainlyscraped/__init__.py').read())[1])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version $v"; exit 1; }
      - run: pip install build twine pytest && pip install -e .
      - run: python -m pytest -q
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Lists the server in the MCP Registry (registry.modelcontextprotocol.io)
  # once the same version is on PyPI. The registry checks that the PyPI
  # README carries `mcp-name: io.github.vhsgreed/certainlyscraped`; GitHub
  # OIDC proves the io.github.vhsgreed namespace, so no secret is needed.
  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: wait for the release on PyPI
        run: |
          v="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/certainlyscraped/$v/json" >/dev/null && exit 0
            sleep 10
          done
          echo "certainlyscraped $v not on PyPI after 5 minutes"; exit 1
      - name: install mcp-publisher
        run: curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
