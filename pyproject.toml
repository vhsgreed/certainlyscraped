[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "certainlyscraped"
dynamic = ["version"]
description = "Probe-first, tiered Python scraper: classify anti-bot defenses, fetch with the cheapest tier that works, extract via YAML + CSS selectors, verify row counts."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<0.29",
    "curl_cffi>=0.7,<0.17",
    "beautifulsoup4>=4.12,<5",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
# Tier 3 is optional and heavy; install only when a probe says it is needed.
tier3 = ["scrapling"]
mcp = ["mcp>=2.3,<3"]
dev = ["pytest>=8"]

[project.scripts]
certainlyscraped = "certainlyscraped.cli:main"
cscrape = "certainlyscraped.cli:main"
# Deprecated: prints one rename notice, removed in 0.5.0. The entry point is
# not in the `scrapeforge` package so the command does not also import the
# shim's DeprecationWarning.
scrapeforge = "certainlyscraped.cli:_deprecated_main"

[project.urls]
Homepage = "https://github.com/vhsgreed/certainlyscraped"

[tool.setuptools]
packages = ["certainlyscraped", "scrapeforge"]

[tool.setuptools.dynamic]
# Single-sourced: certainlyscraped/__init__.py sets the version.
version = { attr = "certainlyscraped.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
